<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Handball Match Flow – Ball und Verlaufskurve</title>
  <desc id="desc">Ein stilisierter Handball, dessen Linien in eine ansteigende Statistik-Kurve übergehen.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="40" x2="442" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142533"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="orange" x1="138" y1="116" x2="386" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe39a"/>
      <stop offset="0.46" stop-color="#ffca55"/>
      <stop offset="1" stop-color="#f5a000"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#background)"/>
  <circle cx="256" cy="256" r="145" fill="#0e1b26" stroke="url(#orange)" stroke-width="22"/>
  <path d="M256 112c-8 60-49 95-110 108M256 112c9 60 50 95 111 108M146 220c28 44 28 82 0 126M367 220c-29 44-29 82 0 126M146 346c59-6 95 17 110 55M367 346c-60-6-96 17-111 55" fill="none" stroke="#ffca55" stroke-width="15" stroke-linecap="round"/>
  <path d="M111 345c51-6 74-38 113-30 35 8 49 45 87 31 35-12 45-56 91-77" fill="none" stroke="#fff4d2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="111" cy="345" r="14" fill="#f5a000" stroke="#fff4d2" stroke-width="7"/>
  <circle cx="224" cy="315" r="14" fill="#f5a000" stroke="#fff4d2" stroke-width="7"/>
  <circle cx="311" cy="346" r="14" fill="#f5a000" stroke="#fff4d2" stroke-width="7"/>
  <path d="M399 241l10 31-32 7" fill="none" stroke="#fff4d2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
