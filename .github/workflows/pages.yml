name: Tests und GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test-Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium
      - name: Unit- und Regressionstests
        run: npm run test:unit
      - name: Browser-Tests
        run: npm run test:e2e

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Website vorbereiten
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
