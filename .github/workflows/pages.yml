name: Tests und GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Only deploy already tested code after screenshot updates"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Screenshot-only deployments must not cancel full push CI.
  group: pages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_only != true
    runs-on: ubuntu-latest
    steps:
      - name: Kurze Sammelwartezeit für Folge-Commits
        run: sleep 10
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test-Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium
      - name: Unit- und Regressionstests
        run: npm run test:unit
      - name: Browser-Tests
        run: npm run test:e2e

  deploy:
    needs: test
    if: >-
      ${{ always() &&
          github.event_name != 'pull_request' &&
          (needs.test.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy_only == true)) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Website vorbereiten
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
