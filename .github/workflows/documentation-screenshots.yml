name: Documentation screenshots
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/handbuch/**'
      - 'index.html'
      - 'src/**'
      - '.github/workflows/documentation-screenshots.yml'
  push:
    paths:
      - 'docs/handbuch/demo/**'
      - 'index.html'
      - 'src/**'
      - '.github/workflows/documentation-screenshots.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: documentation-screenshots-main
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - name: Capture genuine PWA screenshots
        run: python docs/handbuch/demo/capture_screenshots.py --app index.html --fixtures docs/handbuch/demo/fixtures --output documentation-screenshots
      - name: Create help images
        run: python docs/handbuch/demo/publish_help_images.py --screenshots documentation-screenshots --output docs/handbuch/images/generated
      - name: Verify illustrated help in a real browser
        run: python docs/handbuch/demo/verify_help.py --app index.html --output documentation-screenshots
      - name: Keep the full screenshots as a downloadable artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-screenshots
          path: |
            documentation-screenshots
            docs/handbuch/images/generated
          if-no-files-found: warn
          retention-days: 30
      - name: Commit the selected screenshots permanently
        id: screenshot_commit
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/handbuch/images/generated
          if git diff --cached --quiet; then
            echo "Generated screenshots are unchanged."
            exit 0
          fi

          # JPEGs cannot be rebased/merged reliably when main has moved.
          # Keep the validated images outside the checkout, then reapply them
          # onto the latest main commit. Never copy stale images over new UI.
          snapshot_dir="$(mktemp -d)"
          trap 'rm -rf "$snapshot_dir"' EXIT
          cp -a docs/handbuch/images/generated "$snapshot_dir/generated"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "The screenshot source commit is no longer on main; skipping outdated screenshots."
              exit 0
            fi
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- \
              index.html src docs/handbuch/demo .github/workflows/documentation-screenshots.yml; then
              echo "A newer UI or screenshot generator is on main; skipping outdated screenshots."
              exit 0
            fi

            # This checkout is ephemeral and the generated files are backed up.
            # Resetting avoids any binary rebase and stages only screenshots.
            git reset --hard origin/main
            mkdir -p docs/handbuch/images/generated
            cp -a "$snapshot_dir/generated/." docs/handbuch/images/generated/
            git add -- docs/handbuch/images/generated

            if git diff --cached --quiet; then
              echo "The latest main already contains these screenshots."
              exit 0
            fi

            git commit -m "docs: refresh illustrated help screenshots [skip ci]"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Screenshots published successfully."
              exit 0
            fi
            echo "main advanced during push (attempt $attempt); retrying from the latest commit."
          done
          echo "Could not publish screenshots after three attempts." >&2
          exit 1
      - name: Deploy updated screenshots without rerunning tests
        if: steps.screenshot_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main -f deploy_only=true -f tested_sha="$GITHUB_SHA"
