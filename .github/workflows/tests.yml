name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm run test:unit

  e2e:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [chromium-desktop, chromium-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test --project=${{ matrix.viewport }}
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.viewport }}-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore


  verify:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "### Test results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vitest: $UNIT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Playwright: $E2E_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$UNIT_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ]; then
            echo "One or more test jobs did not pass." >&2
            exit 1
          fi
