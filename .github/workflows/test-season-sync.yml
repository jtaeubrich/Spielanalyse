name: Test Season Sync
on:
  push:
    branches: [main]
    paths:
      - "cloud-run-season-sync/**"
      - "src/season-sync-client.js"
      - "src/team-space-client.js"
      - "tests/season-sync-client.test.js"
      - "tests/team-space-client.test.js"
      - ".github/workflows/test-season-sync.yml"
      - ".github/workflows/deploy-season-sync.yml"
  pull_request:
    branches: [main]
    paths:
      - "cloud-run-season-sync/**"
      - "src/season-sync-client.js"
      - "src/team-space-client.js"
      - "tests/season-sync-client.test.js"
      - "tests/team-space-client.test.js"
      - ".github/workflows/test-season-sync.yml"
      - ".github/workflows/deploy-season-sync.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate backend and run API security tests
        run: |
          node --check cloud-run-season-sync/index.js
          node --check cloud-run-season-sync/api.js
          node --check cloud-run-season-sync/storage.js
          node --check cloud-run-season-sync/trainer-accounts.js
          node --test cloud-run-season-sync/api.test.js cloud-run-season-sync/team-space-api.test.js cloud-run-season-sync/trainer-accounts.test.js
      - name: Verify Firebase Admin runtime dependency
        run: |
          cd cloud-run-season-sync
          npm install --omit=dev --no-audit --no-fund
          node --input-type=module -e "await import('firebase-admin/app'); await import('firebase-admin/auth');"
      - name: Run browser-client unit tests
        run: |
          npm install --no-audit --no-fund
          npx vitest run tests/season-sync-client.test.js tests/team-space-client.test.js tests/trainer-auth-client.test.js
