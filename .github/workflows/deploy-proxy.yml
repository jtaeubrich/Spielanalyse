name: Deploy Handball360 Proxy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud-run-proxy/**"
      - ".github/workflows/deploy-proxy.yml"
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check proxy syntax
        run: |
          node --check cloud-run-proxy/index.js
          node --check cloud-run-proxy/schedule.js
          node --check cloud-run-proxy/nuliga-fetch.js
          node --test cloud-run-proxy/nuliga-fetch.test.js
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy source to Cloud Run
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy handball360-proxy \
            --source cloud-run-proxy \
            --project "$PROJECT_ID" \
            --region europe-west1 \
            --quiet
